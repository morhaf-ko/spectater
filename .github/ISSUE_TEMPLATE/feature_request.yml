name: Feature request
description: Suggest a change to the review workflow.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you were trying to do with an OpenSpec review, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour you would like, and how you would verify it.
